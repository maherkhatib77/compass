<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوصلة نت — מצפן נט</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="stylesheet" href="./css/style.css">
<style>
/* ============ HOMEPAGE LAYOUT ============ */
.hp-header {
    background: linear-gradient(135deg, var(--primary, #0d9488) 0%, var(--primary-dark, #0f766e) 100%);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 16px rgba(0,0,0,.06);
}
.hp-header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}
.hp-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #fff;
    text-decoration: none;
}
.hp-logo-icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    border: 3px solid rgba(255,255,255,.4);
    background: rgba(255,255,255,.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
    overflow: hidden;
}
.hp-logo-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.hp-logo-text {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
}
.hp-logo-sub {
    font-size: 12px;
    color: rgba(255,255,255,.7);
    font-weight: 400;
}

/* Navigation Bar */
.hp-nav {
    background: rgba(255,255,255,.95);
    border-bottom: 1px solid var(--gray-200, #e5e5e5);
    padding: 0 24px;
}
.hp-nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
}
.hp-nav-item {
    padding: 12px 18px;
    color: var(--gray-600, #555);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    transition: all .2s;
}
.hp-nav-item:hover, .hp-nav-item.active {
    color: var(--primary, #0d9488);
    border-bottom-color: var(--primary, #0d9488);
    background: var(--primary-bg, #f0fdfa);
}

/* Main Layout: Sidebar (1) + Content (2) = 1:2 ratio */
.hp-main {
    flex: 1;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 32px 24px;
    display: grid;
    grid-template-columns: 1fr 2fr;  /* יחס 1:2 — Sidebar קטן, Content גדול */
    gap: 32px;
}

/* Sidebar (ימני, קטן) */
.hp-sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.hp-sidebar-card {
    background: #fff;
    border-radius: var(--border-radius, 12px);
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}
.hp-sidebar-card h3 {
    font-size: 14px;
    font-weight: 700;
    color: var(--gray-700, #24343f);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--primary, #0d9488);
}
.hp-sidebar-item {
    display: block;
    padding: 10px 12px;
    color: var(--gray-600, #555);
    text-decoration: none;
    font-size: 14px;
    border-radius: 8px;
    transition: all .2s;
    margin-bottom: 4px;
}
.hp-sidebar-item:hover {
    background: var(--primary-bg, #f0fdfa);
    color: var(--primary, #0d9488);
}

/* Content (שמאלי, גדול) */
.hp-content {
    background: #fff;
    border-radius: var(--border-radius, 12px);
    padding: 32px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    min-height: 400px;
}
.hp-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 12px 0; }
.hp-content table { border-collapse: collapse; width: 100%; margin: 16px 0; }
.hp-content td, .hp-content th { border: 1px solid var(--gray-200, #e5e5e5); padding: 10px 14px; text-align: right; }
.hp-content th { background: var(--gray-50, #f7f7f7); font-weight: 700; }
.hp-content a { color: var(--primary, #0d9488); text-decoration: underline; }
.hp-content h1, .hp-content h2, .hp-content h3 { margin: 24px 0 12px; color: var(--gray-700, #24343f); line-height: 1.4; }
.hp-content h1 { font-size: 26px; }
.hp-content h2 { font-size: 22px; }
.hp-content h3 { font-size: 18px; }
.hp-content p { margin-bottom: 12px; line-height: 1.9; }
.hp-content ul, .hp-content ol { margin: 12px 0; padding-right: 24px; }
.hp-content li { margin-bottom: 6px; line-height: 1.8; }

/* Footer */
.hp-footer {
    text-align: center;
    padding: 18px;
    color: var(--gray-300, #999);
    font-size: 12px;
    border-top: 1px solid var(--gray-100, #f2f2f2);
    background: rgba(255,255,255,.7);
    flex-shrink: 0;
}

/* Responsive */
@media (max-width: 768px) {
    .hp-main {
        grid-template-columns: 1fr;
        padding: 16px;
    }
    .hp-header-inner { flex-wrap: wrap; }
    .hp-logo-icon { width: 44px; height: 44px; font-size: 24px; }
}
</style>
</head>
<body>
<!-- ============ HEADER (אופקי) ============ -->
<header class="hp-header">
    <div class="hp-header-inner">
        <a class="hp-logo" href="./index.html">
            <span class="hp-logo-icon" id="globalHeaderLogo">🧭</span>
            <div>
                <div class="hp-logo-text" id="globalHeaderNameAr">بوصلة نت</div>
                <div class="hp-logo-sub" id="globalHeaderNameHe">מצפן נט</div>
            </div>
        </a>
    </div>
</header>

<!-- ============ NAVIGATION (אופקי) ============ -->
<nav class="hp-nav" id="hpNavBar">
    <div class="hp-nav-inner" id="hpNavItems">
        <!-- ייטען דינמית מ-homepage_settings -->
    </div>
</nav>

<!-- ============ MAIN (Sidebar + Content ביחס 1:2) ============ -->
<main class="hp-main">
    <!-- Sidebar (ימני, קטן) -->
    <aside class="hp-sidebar" id="hpSidebar">
        <!-- ייטען דינמית מ-homepage_settings -->
    </aside>

    <!-- Content (שמאלי, גדול) -->
    <div class="hp-content" id="hpMainContent">
        <!-- ייטען דינמית מ-homepage_settings -->
        <p style="text-align:center;color:var(--gray-400);">טוען תוכן...</p>
    </div>
</main>

<!-- ============ FOOTER (אופקי) ============ -->
<footer class="hp-footer" id="globalFooterText">
    بوصلة نت © 2026 | وزارة التربية والتعليم
</footer>

<!-- Scripts -->
<script src="./js/data.js?v=4.11.0"></script>
<script src="./js/global-ui.js?v=1.0.0"></script>
<script>
/**
 * דף שער — טעינת נתונים מ-homepage_settings והצגה
 */
(function() {
    'use strict';

    var currentLang = 'ar'; // ברירת מחדל: ערבית

    /**
     * אתחול
     */
    function init() {
        // הגדרת שנה ב-footer
        var yearEl = document.getElementById('footerYear');
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        if (DataStore.init && typeof DataStore.init === 'function') {
            var _initTimeout = setTimeout(function() {
                console.warn('[Homepage] DataStore.init timed out, starting setup anyway.');
                setup();
            }, 6000);
            DataStore.init(false).then(function() {
                clearTimeout(_initTimeout);
                setup();
            }).catch(function(err) {
                clearTimeout(_initTimeout);
                console.error('[Homepage] DataStore init failed:', err);
                setup();
            });
        } else {
            setup();
        }
    }

    /**
     * הגדרה לאחר טעינת DataStore
     */
    function setup() {
        // 1. זיהוי שפה מהגדרות
        var settings = DataStore.getSettings();
        currentLang = (settings && settings.language) || 'ar';
        applyLanguage(currentLang);

        // 2. טעינת נתוני דף שער
        var hp = DataStore.getHomepage();

        // 3. רינדור סרגל ניווט
        renderNav(hp.navItems || []);

        // 4. רינדור Sidebar
        renderSidebar(hp.sidebarItems || []);

        // 5. רינדור תוכן מרכזי
        renderMainContent(hp.mainContent || { combined: '', he: '', ar: '' });

        // 6. החלת Header/Footer מהגדרות
        if (typeof GlobalUI !== 'undefined') GlobalUI.apply(currentLang);
    }

    /**
     * החלת שפה
     */
    function applyLanguage(lang) {
        currentLang = lang;
        document.documentElement.lang = lang === 'ar' ? 'ar' : 'he';
        document.documentElement.dir = 'rtl'; // גם עברית וגם ערבית הן RTL
    }

    /**
     * רינדור סרגל ניווט
     */
    function renderNav(items) {
        var navBar = document.getElementById('hpNavBar');
        var navContainer = document.getElementById('hpNavItems');
        if (!navBar || !navContainer) return;

        if (!items || items.length === 0) {
            navBar.style.display = 'none';
            return;
        }

        navBar.style.display = 'block';
        navContainer.innerHTML = items
            .filter(function(item) { return item.isActive !== false; })
            .sort(function(a, b) { return (a.order || 0) - (b.order || 0); })
            .map(function(item) {
                var label = currentLang === 'ar' 
                    ? (item.labelAr || item.labelHe || '') 
                    : (item.labelHe || item.labelAr || '');
                var isActive = window.location.pathname.includes(item.url) ? ' active' : '';
                return '<a href="' + (item.url || '#') + '" class="hp-nav-item' + isActive + '">' + label + '</a>';
            }).join('');
    }

    /**
     * רינדור Sidebar
     */
    function renderSidebar(items) {
        var sidebar = document.getElementById('hpSidebar');
        if (!sidebar) return;

        if (!items || items.length === 0) {
            sidebar.style.display = 'none';
            return;
        }

        sidebar.style.display = 'flex';
        sidebar.innerHTML = items
            .filter(function(item) { return item.isActive !== false; })
            .sort(function(a, b) { return (a.order || 0) - (b.order || 0); })
            .map(function(item) {
                var label = currentLang === 'ar' 
                    ? (item.labelAr || item.labelHe || '') 
                    : (item.labelHe || item.labelAr || '');
                return '<a href="' + (item.url || '#') + '" class="hp-sidebar-item">' + label + '</a>';
            }).join('');
    }

    /**
     * רינדור תוכן מרכזי
     */
    function renderMainContent(content) {
        var contentEl = document.getElementById('hpMainContent');
        if (!contentEl) return;

        var html = '';
        if (currentLang === 'ar') {
            html = content.ar || content.combined || content.he || '';
        } else {
            html = content.he || content.combined || content.ar || '';
        }

        if (html && html.trim()) {
            contentEl.innerHTML = html;
        } else {
            contentEl.innerHTML = '<p style="text-align:center;color:var(--gray-400);">אין תוכן להצגה</p>';
        }
    }

    // אתחול
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
