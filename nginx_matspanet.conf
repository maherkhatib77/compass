# Nginx configuration for Matspanet application
# Save this as: /etc/nginx/sites-available/matspanet

upstream matspanet_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;  # Accept all domains, or replace with your domain name

    # Logging
    access_log /workspace/logs/nginx_access.log;
    error_log /workspace/logs/nginx_error.log;

    # Maximum upload size
    client_max_body_size 100M;

    # Proxy settings
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Root location - proxy to Gunicorn
    location / {
        proxy_pass http://matspanet_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Buffer settings
        proxy_buffering off;
        proxy_cache off;
    }

    # Static files (if you have a static directory)
    location /static/ {
        alias /workspace/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://matspanet_app/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
